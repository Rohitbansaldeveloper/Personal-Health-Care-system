apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: healthcare-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:latest
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "root_token_placeholder"
        ports:
        - containerPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: healthcare-ns
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
